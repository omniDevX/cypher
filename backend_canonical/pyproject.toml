[project]
name = "OntologyKnowledgeGraphCypher"
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.3",
    "neo4j>=6.4.1",
    "psycopg2-binary>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[tool.ruff.lint]
ignore = ["B008","I001","BLE001"]
